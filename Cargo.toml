[package]
name = "internetdata-axum"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "The official axum and tower middleware for the InternetData API: look up the visitor behind each request, where they are, which network they come from and whether it is a VPN, a proxy or a hosting server, and optionally refuse them."
authors = ["InternetData <dev@internetdata.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://internetdata.io"
repository = "https://github.com/internetdata/sdk-rust-axum"
documentation = "https://docs.rs/internetdata-axum"
keywords = ["ip", "geoip", "vpn", "axum", "middleware"]
categories = ["web-programming", "network-programming", "api-bindings"]
exclude = ["/.github"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
internetdata = "2.12.0"
tower-layer = "0.3"
tower-service = "0.3"

[dev-dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[features]
default = ["rustls-tls"]
rustls-tls = ["internetdata/rustls-tls"]
native-tls = ["internetdata/native-tls"]

[package.metadata.docs.rs]
all-features = true
